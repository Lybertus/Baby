<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="beanieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="swaddleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="babyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#021a36" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Apple Squircle Outer Canvas -->
  <rect width="100" height="100" rx="22.5" fill="url(#appleBg)"/>
  <rect x="1" y="1" width="98" height="98" rx="21.5" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Ambient Light Reflection -->
  <circle cx="50" cy="26" r="46" fill="rgba(255,255,255,0.07)" />

  <!-- Subtle Concentric Precision Halo (Apple Design Language) -->
  <circle cx="50" cy="50" r="36" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- The Minimalist Apple Baby Symbol -->
  <g filter="url(#babyGlow)">
    <!-- Swaddled Body (Ergonomic Sleep Sack / Cocoon) -->
    <path d="M 27 58 C 26 75 40 83 50 83 C 60 83 74 75 73 58 C 72 50 63 46 50 46 C 37 46 28 50 27 58 Z" fill="url(#swaddleGrad)" />
    
    <!-- Swaddle Overlap Fold Lines -->
    <path d="M 33 56 C 41 64 56 68 67 61" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.45" fill="none" />
    <path d="M 67 58 C 59 66 43 69 33 63" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.35" fill="none" />

    <!-- Baby Head -->
    <circle cx="50" cy="40.5" r="15.5" fill="#ffffff" />

    <!-- Newborn Beanie Cap -->
    <path d="M 35 39 C 35 24 65 24 65 39 Z" fill="url(#beanieGrad)" />
    <!-- Beanie Folded Cuff -->
    <rect x="33.5" y="37" width="33" height="4.5" rx="2.2" fill="#bae6fd" />
    <!-- Beanie Top Knot / Pompom -->
    <circle cx="50" cy="22.5" r="3.2" fill="#bae6fd" />

    <!-- Sleeping Eyes (Gentle peaceful arcs) -->
    <path d="M 42 43 C 43.5 45.5 46.5 45.5 48 43" stroke="#0369a1" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M 52 43 C 53.5 45.5 56.5 45.5 58 43" stroke="#0369a1" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Rosy Cheek Blushes -->
    <circle cx="40" cy="46.5" r="2.6" fill="#f43f5e" fill-opacity="0.35" />
    <circle cx="60" cy="46.5" r="2.6" fill="#f43f5e" fill-opacity="0.35" />

    <!-- Gentle Baby Smile -->
    <path d="M 48 48.5 C 49 50 51 50 52 48.5" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>
</svg>